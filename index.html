<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鲜知 FreshSense · 智能冰箱显示屏</title>
  <link rel="stylesheet" href="./styles.css?v=5" />
</head>
<body>
  <div class="stage">
    <div class="screen-frame">
      <div class="screen-glare"></div>
      <header class="screen-header">
        <div class="brand">
          <span class="brand-mark">鲜</span>
          <div><strong>鲜知 FreshSense</strong><small>智能冰箱显示屏 · FS-Screen 10.1</small></div>
        </div>
      </header>
      <div class="screen-body">
        <nav id="screen-nav" class="screen-nav"></nav>
        <main id="screen-content" class="screen-content"></main>
      </div>
      <footer class="screen-footer">
        <span>鲜知 OS · 屏幕端演示</span>
        <span id="footer-tip">点按任意分区或卡片查看详情</span>
      </footer>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="./data.js?v=5"></script>
  <script src="./app.js?v=5"></script>
</body>
</html>
